<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aether - 智能語音控制</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0f">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="logo">
        <div class="logo-icon"></div>
        <span>Aether</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="showPage('settings')">⚙️</button>
      </div>
    </header>
    <main>
      <section id="page-home" class="page active">
        <div class="connected-card">
          <div class="device-info">
            <div class="device-icon">🎧</div>
            <div>
              <div class="device-name">Aether Earbuds Pro</div>
              <div class="device-status">藍牙已連接</div>
            </div>
          </div>
          <div class="status-dot connected"></div>
        </div>
        <div class="voice-center">
          <div class="mic-button" id="micBtn" onclick="toggleListening()">
            <div class="mic-icon">🎤</div>
            <div class="pulse-ring"></div>
          </div>
          <div class="voice-status" id="voiceStatus">點擊開始說話</div>
          <div class="transcript" id="transcript"></div>
        </div>
        <div class="quick-actions">
          <div class="action-card" onclick="executeQuickAction('email')">
            <div class="action-icon">✉️</div>
            <div>Email</div>
            <div class="action-desc">語音撰寫郵件</div>
          </div>
          <div class="action-card" onclick="executeQuickAction('typing')">
            <div class="action-icon">⌨️</div>
            <div>打字</div>
            <div class="action-desc">語音轉文字</div>
          </div>
          <div class="action-card" onclick="showPage('agents')">
            <div class="action-icon">✨</div>
            <div>AI 代理</div>
            <div class="action-desc">自動完成任務</div>
          </div>
        </div>
      </section>
      <section id="page-agents" class="page">
        <h2>AI 代理</h2>
        <p class="subtitle">說出指令即可自動執行</p>
        <div class="agent-card">
          <div class="agent-header">
            <div><strong>每日郵件摘要</strong><div class="agent-desc">整理收件匣重點</div></div>
            <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
          </div>
        </div>
        <div class="agent-card">
          <div class="agent-header">
            <div><strong>自動報告</strong><div class="agent-desc">生成報告</div></div>
            <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
          </div>
        </div>
      </section>
      <section id="page-settings" class="page">
        <h2>功能設定</h2>
        <div class="feature-item">
          <div><strong>語音打字</strong></div>
          <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
        </div>
        <div class="feature-item">
          <div><strong>系統控制</strong></div>
          <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
        </div>
        <div class="feature-item">
          <div><strong>AI 代理</strong></div>
          <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
        </div>
      </section>
    </main>
    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="showPage('home')">🏠 首頁</button>
      <button class="nav-btn" onclick="showPage('agents')">✨ 代理</button>
      <button class="nav-btn" onclick="showPage('settings')">⚙️ 設定</button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
