<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aether - 智能語音控制</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0f">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="logo">
        <div class="logo-icon"></div>
        <span>Aether</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="showPage('settings')">⚙️</button>
      </div>
    </header>
    <main>
      <section id="page-home" class="page active">
        <div class="connected-card">
          <div class="device-info">
            <div class="device-icon">🎧</div>
            <div>
              <div class="device-name">Aether Earbuds Pro</div>
              <div class="device-status" data-i18n="connected">藍牙已連接</div>
            </div>
          </div>
          <div class="status-dot connected"></div>
        </div>
        <div class="voice-center">
          <div class="mic-button" id="micBtn" onclick="toggleListening()">
            <div class="mic-icon">🎤</div>
            <div class="pulse-ring"></div>
          </div>
          <div class="voice-status" id="voiceStatus" data-i18n="tapToSpeak">點擊開始說話</div>
          <div class="transcript" id="transcript"></div>
        </div>
        <div class="quick-actions">
          <div class="action-card" onclick="executeQuickAction('email')">
            <div class="action-icon">✉️</div>
            <div data-i18n="email">Email</div>
            <div class="action-desc" data-i18n="emailDesc">語音撰寫郵件</div>
          </div>
          <div class="action-card" onclick="executeQuickAction('typing')">
            <div class="action-icon">⌨️</div>
            <div data-i18n="typing">打字</div>
            <div class="action-desc" data-i18n="typingDesc">語音轉文字</div>
          </div>
          <div class="action-card" onclick="showPage('agents')">
            <div class="action-icon">✨</div>
            <div data-i18n="aiAgent">AI 代理</div>
            <div class="action-desc" data-i18n="aiAgentDesc">自動完成任務</div>
          </div>
        </div>
      </section>
      <section id="page-agents" class="page">
        <h2 data-i18n="aiAgent">AI 代理</h2>
        <p class="subtitle" data-i18n="agentsSubtitle">說出指令即可自動執行</p>
        <div class="agent-card">
          <div class="agent-header">
            <div><strong data-i18n="dailyEmail">每日郵件摘要</strong><div class="agent-desc" data-i18n="dailyEmailDesc">整理收件匣重點</div></div>
            <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
          </div>
        </div>
        <div class="agent-card">
          <div class="agent-header">
            <div><strong data-i18n="autoReport">自動報告</strong><div class="agent-desc" data-i18n="autoReportDesc">生成報告</div></div>
            <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
          </div>
        </div>
      </section>
      <section id="page-settings" class="page">
        <h2 data-i18n="settings">功能設定</h2>
        <div class="feature-item" style="flex-direction: column; align-items: flex-start; gap: 10px;">
          <strong data-i18n="speechLang">語音辨識語言</strong>
          <select id="langSelect" onchange="changeLanguage(this.value)" style="width: 100%; padding: 10px; border-radius: 8px; background: #1e1e2a; color: white; border: 1px solid #2a2a3a;">
            <option value="zh-TW">繁體中文（台灣）</option>
            <option value="zh-CN">簡體中文（中國）</option>
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="ja-JP">日本語</option>
            <option value="ko-KR">한국어</option>
            <option value="es-ES">Español</option>
            <option value="fr-FR">Français</option>
            <option value="de-DE">Deutsch</option>
            <option value="pt-BR">Português (Brasil)</option>
            <option value="it-IT">Italiano</option>
            <option value="ru-RU">Русский</option>
            <option value="ar-SA">العربية</option>
            <option value="hi-IN">हिन्दी</option>
            <option value="th-TH">ไทย</option>
            <option value="vi-VN">Tiếng Việt</option>
            <option value="id-ID">Bahasa Indonesia</option>
            <option value="ms-MY">Bahasa Melayu</option>
            <option value="nl-NL">Nederlands</option>
            <option value="pl-PL">Polski</option>
            <option value="tr-TR">Türkçe</option>
            <option value="sv-SE">Svenska</option>
            <option value="da-DK">Dansk</option>
            <option value="fi-FI">Suomi</option>
            <option value="no-NO">Norsk</option>
            <option value="el-GR">Ελληνικά</option>
            <option value="he-IL">עברית</option>
            <option value="cs-CZ">Čeština</option>
            <option value="hu-HU">Magyar</option>
            <option value="ro-RO">Română</option>
            <option value="uk-UA">Українська</option>
            <option value="bg-BG">Български</option>
            <option value="hr-HR">Hrvatski</option>
            <option value="sk-SK">Slovenčina</option>
            <option value="sl-SI">Slovenščina</option>
            <option value="et-EE">Eesti</option>
            <option value="lv-LV">Latviešu</option>
            <option value="lt-LT">Lietuvių</option>
            <option value="fil-PH">Filipino</option>
            <option value="bn-IN">বাংলা</option>
            <option value="ta-IN">தமிழ்</option>
            <option value="te-IN">తెలుగు</option>
            <option value="mr-IN">मराठी</option>
            <option value="gu-IN">ગુજરાતી</option>
            <option value="kn-IN">ಕನ್ನಡ</option>
            <option value="ml-IN">മലയാളം</option>
            <option value="pa-IN">ਪੰਜਾਬੀ</option>
            <option value="ur-PK">اردو</option>
            <option value="fa-IR">فارسی</option>
            <option value="sw-KE">Kiswahili</option>
            <option value="af-ZA">Afrikaans</option>
            <option value="zu-ZA">isiZulu</option>
          </select>
          <div style="font-size: 12px; color: #a0a0b0;" data-i18n="langHint">選擇正確語言可大幅提升辨識準確度</div>
        </div>
        <div class="feature-item">
          <div><strong data-i18n="voiceTyping">語音打字</strong></div>
          <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
        </div>
        <div class="feature-item">
          <div><strong data-i18n="systemControl">系統控制</strong></div>
          <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
        </div>
        <div class="feature-item">
          <div><strong data-i18n="aiAgent">AI 代理</strong></div>
          <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
        </div>
      </section>
    </main>
    <nav class="bottom-nav">
      <button class="nav-btn active" onclick="showPage('home')" data-i18n="home">🏠 首頁</button>
      <button class="nav-btn" onclick="showPage('agents')" data-i18n="agents">✨ 代理</button>
      <button class="nav-btn" onclick="showPage('settings')" data-i18n="settings">⚙️ 設定</button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
